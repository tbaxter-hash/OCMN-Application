# Publishes the OCMN Application Printer to GitHub Pages so it can be opened from a link.
# The page reads spreadsheets inside the visitor's browser; nothing is sent back to the site.
name: Publish Application Printer

on:
  push:
    branches: [claude/keen-brown-pcqunp]
    paths: ["tools/application-printer/**", ".github/workflows/application-printer-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: |
          node tools/application-printer/build.mjs
          mkdir -p _site
          cp "tools/application-printer/dist/OCMN Application Printer.html" _site/index.html
          cp "tools/application-printer/dist/OCMN Application Printer.html" "_site/OCMN Application Printer.html"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
